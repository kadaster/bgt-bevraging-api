components:
  schemas:
    API-info:
      title: API-info
      type: object
      properties:
        api-name:
          type: string
          description: De naam van de API.
        api-version:
          type: string
          description: Versie van de API.
        api-description:
          type: string
          description: Omschrijving van de API.
        informationmodel:
          type: string
          description: Naam van het informatiemodel dat als basis is genomen voor
            deze API.
        informationmodel-version:
          type: string
          description: Versie van het logische informatiemodel dat als basis is genomen
            voor deze API.
        informationmodel-location:
          type: string
          description: Locatie (URI) van het logische informatiemodel die als basis
            is genomen voor deze API.
          format: uri
      description: Algemene informatie voor gebruikers van de API.
    Aanleveraar:
      title: Aanleveraar
      type: object
      description: "Een aanleveraar is een organisatie die BGT mutatiebestanden aanlevert\
        \ bij de LV BGT. \nEen aanleveraar kan een bronhouder zijn of een dataleverancier.\
        \ Een dataleverancier \nis een organisatie die door een bronhouder is gemachtigd\
        \ om namens die bronhouder \ngedurende een bepaalde periode mutaties door\
        \ te voeren op BGT objecten.\nEen dataleverancier kan een andere bronhouder,\
        \ een samenwerkingsverband of een \ncommerci�le marktpartij zijn.\n"
      allOf:
      - $ref: '#/components/schemas/Organisatie'
      - required:
        - code
        - geregistreerdMet
        - naam
        type: object
        properties:
          code:
            $ref: '#/components/schemas/AanleveraarCode'
          naam:
            title: naam
            maxLength: 80
            minLength: 1
            type: string
            description: Een offici�le naam die aan een organisatie is toegekend.
            example: Kadaster
          geregistreerdMet:
            $ref: '#/components/schemas/RegistratieLV'
    AanleveraarCode:
      title: AanleveraarCode
      pattern: "^[GKLPSW]{1}[0-9]{4}|\\d{8}|\\d{9}$"
      type: string
      description: "Bronhouders hebben een unieke bronhouder code, samenwerkingsverbanden\
        \ kunnen een \nbronhouder code hebben maar commerci�le marktpartijen hebben\
        \ die niet. Alle \norganisaties hebben wel een KvK nummer en een RSIN (behalve\
        \ eenmanszaken).\nDaarom kan hier een bronhouder code, KvK nummer en/of RSIN\
        \ worden opgegeven.\n"
    AanleveraarHal:
      allOf:
      - $ref: '#/components/schemas/AanleveraarHalBasis'
    AanleveraarHalBasis:
      allOf:
      - $ref: '#/components/schemas/Aanleveraar'
      - properties:
          _links:
            $ref: '#/components/schemas/AanleveraarLinks'
    AanleveraarLinks:
      required:
      - self
      type: object
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
    Aanlevering:
      title: Aanlevering
      required:
      - aangeleverdDoor
      - aangeleverdNamens
      - aanleverDatum
      - aanleverNummer
      - bestaatUit
      - geregistreerdMet
      - identificatie
      - verwerkingssoort
      - verwerkingsstatus
      type: object
      properties:
        identificatie:
          $ref: '#/components/schemas/AanleveringIdentificatie'
        aanleverNummer:
          type: string
          description: Identificatie van de aanlevering aangeleverd door bronhouder
            of dataleverancier.
        aangeleverdNamens:
          $ref: '#/components/schemas/BronhouderCode'
        aangeleverdDoor:
          $ref: '#/components/schemas/AanleveraarCode'
        aanleverDatum:
          type: string
          description: De datum van aanleveren.
          format: date
        bestaatUit:
          $ref: '#/components/schemas/Bestand'
        referentie:
          $ref: '#/components/schemas/Referentie'
        verwerkingssoort:
          $ref: '#/components/schemas/Verwerkingssoort'
        verwerkingsstatus:
          $ref: '#/components/schemas/Verwerkingsstatus'
        geregistreerdMet:
          $ref: '#/components/schemas/Registratie'
      description: De gegevens van een aanlevering.
    AanleveringHalBasis:
      allOf:
      - $ref: '#/components/schemas/Aanlevering'
      - properties:
          _links:
            $ref: '#/components/schemas/AanleveringLinks'
    AanleveringIdentificatie:
      title: AanleveringIdentificatie
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      type: string
      description: "De unieke aanduiding van een aanlevering gegenereerd door de LV\
        \ BGT conform \nUUIDv7 specificatie, zie [RFC 9562](https://www.rfc-editor.org/info/rfc9562/).\n"
      format: uuid
      example: 0199a6e6-f20a-7f4a-bc01-0f2e7c9d8ab3
    AanleveringLinks:
      required:
      - self
      type: object
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
        aangeleverdNamens:
          $ref: '#/components/schemas/HalLink'
        aangeleverdDoor:
          $ref: '#/components/schemas/HalLink'
