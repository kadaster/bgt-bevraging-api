          $ref: '#/components/schemas/HalLink'
        bronhouder:
          $ref: '#/components/schemas/HalLink'
        aanleveraar:
          $ref: '#/components/schemas/HalLink'
        ligtInWijk:
          $ref: '#/components/schemas/HalLink'
        ligtInStadsdeel:
          $ref: '#/components/schemas/HalLink'
        heeftOpenbareRuimteLabel:
          $ref: '#/components/schemas/HalLink'
    ObjectRegistratieHalCollection:
