          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ExtendedProblemDetails'
              example:
                status: 405
                title: Methode niet toegestaan
                type: https://datatracker.ietf.org/doc/html/rfc9110#name-405-method-not-allowed
                detail: The method specified in the Request-Line is not allowed for
                  the resource identified by the Request-URI.
                instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
                code: methodNotAllowed
        "406":
          description: Not Acceptable. U heeft waarschijnlijk een gewenst formaat
            met de `Accept` header verstuurd welke niet wordt ondersteund.
          headers:
            API-Version:
