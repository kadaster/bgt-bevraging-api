            code: preconditionFailed
    "416":
      description: Range not satisfiable.
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Warning:
          $ref: '#/components/headers/Warning'
        Content-Range:
          $ref: '#/components/headers/Content-Range'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ExtendedProblemDetails'
          example:
            status: 416
            title: Aangevraagd bereik niet beschikbaar
            type: https://datatracker.ietf.org/doc/html/rfc9110#name-416-range-not-satisfiable
            detail: The server indicates that the set of ranges in the request's Range
              header field has been rejected either because none of the requested
              ranges are satisfiable or because the client has requested an excessive
              number of small or overlapping ranges (a potential denial of service
              attack).
            instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
            code: notSatisfiable
    "500":
      description: Internal server error.
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Warning:
          $ref: '#/components/headers/Warning'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ExtendedProblemDetails'
          example:
            status: 500
            title: Interne server fout.
            type: https://datatracker.ietf.org/doc/html/rfc9110#name-500-internal-server-error
            detail: The server encountered an unexpected condition which prevented
              it from fulfilling the request.
            instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
            code: serverError
    "503":
      description: Service Unavailable. Er vindt mogelijk (gepland) onderhoud of een
        storing plaats.
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Warning:
          $ref: '#/components/headers/Warning'
        Retry-After:
          description: Tijdstip waarop verwacht wordt dat de service weer beschikbaar
            zal zijn.
          style: simple
          explode: false
          schema:
            type: string
            format: date-time
          x-example: "Sun, 28 Nov 2017 16:41:41 GMT"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ExtendedProblemDetails'
          example:
            status: 503
            title: "Bronservice {bron} is tijdelijk niet beschikbaar."
            type: https://datatracker.ietf.org/doc/html/rfc9110#name-503-service-unavailable
            detail: The service is currently unable to handle the request due to a
              temporary overloading or maintenance of the server.
            instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
            code: notAvailable
    default:
      description: Er is een onverwachte fout opgetreden.
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Warning:
          $ref: '#/components/headers/Warning'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ExtendedProblemDetails'
  parameters:
    If-Range:
      name: If-Range
      in: header
      description: "Met de If-Range-header kan een client een gedeeltelijke download\
        \ hervatten. \nAls de gevraagde bron sinds de vorige versie niet is veranderd,\
        \ retourneert \nde server alleen het aangevraagde bereik (Range). Als de bron\
        \ wel is gewijzigd, \nretourneert de server de volledige inhoud van de bron.\n"
