  responses:
    "400":
      description: Bad request
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Warning:
          $ref: '#/components/headers/Warning'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BadRequestProblemDetails'
          example:
            status: 400
            title: Ongeldig verzoek.
            type: https://datatracker.ietf.org/doc/html/rfc9110#name-400-bad-request
            detail: The request could not be understood by the server due to malformed
              syntax. The client SHOULD NOT repeat the request without modification.
            instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
            code: paramsRequired
            invalid-params:
            - type: https://www.vng.nl/realisatie/api/validaties/integer
              name: verblijfplaats_huisnummer
              code: integer
              reason: Waarde is geen geldige integer.
    "401":
      description: Unauthorized. Mogelijk is er een ongeldige `X-Api-Key` header meegestuurd.
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Warning:
          $ref: '#/components/headers/Warning'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ExtendedProblemDetails'
          example:
            status: 401
            title: Niet correct geauthenticeerd.
            type: https://datatracker.ietf.org/doc/html/rfc9110#name-401-unauthorized
            detail: The request requires user authentication. The response MUST include
              a WWW-Authenticate header field (section 14.47) containing a challenge
              applicable to the requested resource.
            instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
            code: authentication
    "403":
      description: Forbidden. U heeft geen rechten om deze URL te benaderen.
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Warning:
          $ref: '#/components/headers/Warning'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ExtendedProblemDetails'
          example:
            status: 403
            title: U bent niet geautoriseerd voor deze operatie.
            type: https://datatracker.ietf.org/doc/html/rfc9110#name-403-forbidden
            detail: "The server understood the request, but is refusing to fulfill\
              \ it."
            instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
            code: autorisation
    "404":
