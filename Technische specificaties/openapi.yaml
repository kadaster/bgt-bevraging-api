      properties:
        identificatie:
          $ref: '#/components/schemas/ObjectIdentificatie'
        type:
          $ref: '#/components/schemas/ObjectType'
    ObjectIdentificatie:
      pattern: "^[A-Z][0-9]{4}\\.[A-Za-z0-9]{1,34}$"
