openapi: 3.0.4
info:
  title: Bevraging API van de LV BGT
  description: "Dit is de [BGT Bevraging API](https://zakelijk.kadaster.nl/-/bgt-bevraging-api)\
    \ van de Landelijke Voorziening Basisregistratie Grootschalige Topografie (LVBGT).\n\
    \nMeer informatie over de Basisregistratie Grootschalige Topografie is te vinden\
    \ op de website van het [Ministerie van Binnenlandse Zaken en Koninkrijksrelaties](https://www.geobasisregistraties.nl/basisregistraties/grootschalige-topografie)\
    \ en [Kadaster](https://www.kadaster.nl/zakelijk/registraties/basisregistraties/bgt).\n\
    \nDe BGT Bevraging API levert functionaliteit voor het opvragen van actuele en\
    \ historische data van BGT objecten.\n\nDe API-specificatie volgt de [Nederlandse\
    \ API-Strategie](https://docs.geostandaarden.nl/api/API-Strategie/) versie van\
    \ 21 december 2023, [NLGov REST API Design Rules](https://gitdocumentatie.logius.nl/publicatie/api/adr/2.2.2/)\
    \ en is opgesteld in [OpenAPI Specificatie](https://www.forumstandaardisatie.nl/standaard/openapi-specification)\
    \ (OAS) v3.\n\nIn veel gevallen wordt het mediatype HAL (`application/hal+json`)\
    \ gebruikt. Dit is een mediatype voor het weergeven van resources en hun relaties\
    \ via hyperlinks.\n\nGeometrie data wordt geleverd in JSON-FG formaat conform:\
    \ [JSON-FG schema](https://schemas.opengis.net/json-fg/).\n\nDeze API is enerzijds\
    \ gericht op het opvragen van actuele data van BGT objecten, zodat bronhouders\
    \ en dataleveranciers deze data kunnen muteren en anderzijds op het opvragen van\
    \ historische data van BGT objecten zodat bronhouders en dataleveranciers een\
    \ eventuele eigen registratie kunnen bijhouden.\nOok kan met deze API de voortgang\
    \ van de verwerking van asynchrone bevragingen worden gevolgd.\nOm gebruik te\
    \ kunnen maken van de BGT Bevraging API is autorisatie vereist, deze bestaat uit\
    \ een PKI-O certificaat.\nDaarnaast moeten gebruikers toegang hebben tot een bepaalde\
    \ autorisatie groep en ontvangen gebruikers een API key.\nDe API key wordt gebruikt\
    \ voor toegangscontrole, rate limiting, monitoring, gebruiksgegevens en omgevingsscheiding.\n\
    \nEen API key is te verkrijgen door.... (TBD).\n\nVoor vragen, neem contact op\
    \ met LVBGT beheer."
  termsOfService: https://www.kadaster.nl/algemene-leveringsvoorwaarden
  contact:
    name: Kadaster - Beheerder Landelijke Voorziening BGT
    url: https://www.kadaster.nl/zakelijk/registraties/basisregistraties/bgt
    email: bgt@kadaster.nl
  license:
    name: "European Union Public License, version 1.2 (EUPL-1.2)"
    url: https://eupl.eu/1.2/nl/
  version: 1.0.0
servers:
- url: https://api.bgt.kadaster.nl/bevraging/v1
  description: LVBGT - PRODUCTIE
tags:
- name: Aanleveraar
  description: Dit endpoint levert functionaliteit voor het bevragen van aanleveraars.
- name: Algemene informatie
  description: Dit endpoint levert algemene informatie over de BGT Bevraging API.
- name: Bevraging
  description: "Dit endpoint levert functionaliteit voor het opvragen van de status\
    \ en het resultaat van asynchrone bevragingen.\nHet ophalen van bestanden volgt\
    \ zoveel mogelijk de:\n  \n- de [Digikoppeling Koppelvlakstandaard Grote Berichten\
    \ standaard](https://gitdocumentatie.logius.nl/publicatie/dk/gb/).\n \n- de [Digikoppeling\
    \ Koppelvlakstandaard REST API](https://gitdocumentatie.logius.nl/publicatie/dk/restapi/4.0.1/).\n\
    \n- het concept van de [NL API Design Rules - Transfer module](https://logius-standaarden.github.io/API-mod-transfer/).\n"
- name: Bronhouder
  description: Dit endpoint levert functionaliteit voor het bevragen van bronhouders.
- name: CRS discovery
  description: Dit endpoint levert lijsten met ondersteunde en opgeslagen CRS-en.
- name: Object
  description: "Dit endpoint levert functionaliteit voor het opvragen van BGT objecten.\n\
    De bevraging volgt zoveel mogelijk: \n    \n- de [NL API Design Rules - Batching\
    \ module](https://geonovum.github.io/KP-APIs/API-strategie-modules/batching/).\n"
paths:
  /aanleveraars/{aanleveraarIdentificatie}:
    get:
      tags:
      - Aanleveraar
      summary: Opvragen van een specifieke aanleveraar.
      description: "Opvragen van een aanleveraar met een identificatie die door de\
        \ LV BGT is uitgegeven. \n\nDe geldigOp en beschikbaarOp parameters kunnen\
        \ gebruikt worden voor \ntijdreis vragen. Zie: TBD.\n"
      operationId: opvragenAanleveraar
      parameters:
      - name: aanleveraarIdentificatie
        in: path
        description: |
          De door de LV BGT gegenereerde identificatie van een aanleveraar.
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/aanleveraarIdentificatie'
      - name: geldigOp
        in: query
        description: "Filtert op objecten die geldig zijn op de opgegeven datum `JJJJ-MM-DD`\n\
          Deze parameter komt uit de API strategie, het hoofdstuk \n[Temporal](https://docs.geostandaarden.nl/api/API-Strategie-ext/#temporal).\n"
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
          example: 2019-11-23
      - name: beschikbaarOp
        in: query
        description: "Filtert op objecten die beschikbaar zijn op de opgegeven datum\
          \ en tijd \n`YYYY-MM-DDThh:mm:ss.sss'. Hierin kunnen de seconden ':ss' en\
          \ milliseconden \n'.sss' of alleen de milliseconden conform ISO 8601 specificatie\
          \ worden \nweggelaten, in dat geval krijgen deze automatisch de waarde ':00'\
          \ \nrespectievelijk '.000'. Indien er voor de milliseconden '.sss' meer\
          \ dan 3 \ncijfers worden opgegeven, bv. '.12345', dan wordt dit afgekapt\
          \ tot '.123'.\nDeze parameter komt uit de API strategie, het hoofdstuk \n\
          [Temporal](https://docs.geostandaarden.nl/api/API-Strategie-ext/#temporal).\n"
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
          example: 2019-11-04T12:00:00+01:00
      responses:
        "200":
          description: opvragen aanleveraar geslaagd
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            Warning:
              $ref: '#/components/headers/Warning'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AanleveraarHal'
        "400":
          description: Bad request
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            Warning:
              $ref: '#/components/headers/Warning'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblemDetails'
              example:
                status: 400
                title: Ongeldig verzoek.
                type: https://datatracker.ietf.org/doc/html/rfc9110#name-400-bad-request
                detail: The request could not be understood by the server due to malformed
                  syntax. The client SHOULD NOT repeat the request without modification.
                instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
                code: paramsRequired
                invalid-params:
                - type: https://www.vng.nl/realisatie/api/validaties/integer
                  name: verblijfplaats_huisnummer
                  code: integer
                  reason: Waarde is geen geldige integer.
        "401":
          description: Unauthorized. Mogelijk is er een ongeldige `X-Api-Key` header
            meegestuurd.
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            Warning:
              $ref: '#/components/headers/Warning'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ExtendedProblemDetails'
              example:
                status: 401
                title: Niet correct geauthenticeerd.
                type: https://datatracker.ietf.org/doc/html/rfc9110#name-401-unauthorized
                detail: The request requires user authentication. The response MUST
                  include a WWW-Authenticate header field (section 14.47) containing
                  a challenge applicable to the requested resource.
                instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
                code: authentication
        "403":
          description: Forbidden. U heeft geen rechten om deze URL te benaderen.
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            Warning:
              $ref: '#/components/headers/Warning'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ExtendedProblemDetails'
              example:
                status: 403
                title: U bent niet geautoriseerd voor deze operatie.
                type: https://datatracker.ietf.org/doc/html/rfc9110#name-403-forbidden
                detail: "The server understood the request, but is refusing to fulfill\
                  \ it."
                instance: https://datapunt.voorbeeldgemeente.nl/api/v1/resourcenaam?parameter=waarde
                code: autorisation
        "404":
          description: Not found.
