      - Plaatsbepalingspunt
      - Put
      - Sensor
      - Scheiding
      - Spoor
      - Stadsdeel
      - Straatmeubilair
      - Tunneldeel
      - Vegetatieobject
      - Waterdeel
      - Waterinrichtingselement
      - Waterschap
      - Wegdeel
      - Weginrichtingselement
      - Wijk
    ObjectenBevragingResponse:
      required:
      - bevragingIdentificatie
      - status
      type: object
      properties:
        bevragingIdentificatie:
          $ref: '#/components/schemas/BevragingIdentificatie'
