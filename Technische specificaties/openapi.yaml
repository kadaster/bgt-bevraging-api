            $ref: '#/components/schemas/CurvePolygon'
          plus-type:
            $ref: '#/components/schemas/TypeGebouwInstallatiePlus'
    HTTP-date:
      pattern: "^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \\d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\
        \ \\d{4} \\d{2}:\\d{2}:\\d{2} GMT$"
      type: string
      description: "Een HTTP-date zoals gespecficieerd in RFC 9110, zie https://datatracker.ietf.org/doc/html/rfc9110#name-date-time-formats."
      example: "Fri, 31 Dec 1999 23:59:59 GMT"
    HalCollectionLinks:
      title: HalCollectionLinks
      type: object
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
    HalLink:
      required:
      - href
      type: object
      properties:
        href:
          $ref: '#/components/schemas/Href'
        templated:
          type: boolean
        title:
          type: string
          description: Voor mens leesbaar label bij de link
      description: "Het Link Object zoals gespecificeerd in \nhttps://tools.ietf.org/html/draft-kelly-json-hal-08#section-5'\n"
    Href:
      title: Href
      type: string
      example: "https://{base-uri}/{dienst}/{apinaam}/{major-versie}/resourcenaam/{resource-identificatie}"
    IMGeo-object:
      title: IMGeo-object
      required:
      - aanleveringIdentificatie
      - bgt-status
      - bronhouder
      - geometrieJSON-FG
      - geometrieXML
      - geregistreerdMet
      - identificatie
      - inOnderzoek
      - objectBegintijd
      - relatieveHoogteLigging
      - tijdstipRegistratie
      type: object
      properties:
        identificatie:
          type: string
          description: |
            Uniek identificatiEnumeratiewaardemer voor het object
            dat onveranderlijk is zolang het object bestaat.
        objectBegintijd:
          type: string
          description: Datum waarop het object bij de bronhouder is ontstaan.
          format: date
        objectEindtijd:
          type: string
          description: Datum waarop het object bij de bronhouder niet meer geldig
            is.
          format: date
        tijdstipRegistratie:
          type: string
          description: "De status gekoppeld aan de levenscyclus van een geo-object,\n\
            indien dit een uitbreiding van de populatie betreft.\n"
          format: date-time
        eindRegistratie:
          type: string
          description: "De status gekoppeld aan de levenscyclus van een geo-object,\n\
            indien dit een uitbreiding van de populatie betreft.\n"
          format: date-time
        LV-publicatiedatum:
          type: string
          description: "Tijdstip waarop deze instantie van het object is opgenomen\
            \ in de \nLandelijke Voorziening.\n"
          format: date-time
        bronhouder:
          type: string
          description: De bronhoudercode van het object.
        inOnderzoek:
          type: boolean
          description: "Een aanduiding waarmee wordt aangegeven dat een onderzoek\
            \ wordt uitgevoerd \nnaar de juistheid van een of meer gegevens van het\
            \ betreffende object.\n"
        relatieveHoogteLigging:
          type: integer
          description: Aanduiding voor de relatieve hoogte van het object.
        bgt-status:
          $ref: '#/components/schemas/Status'
        plus-status:
          $ref: '#/components/schemas/StatusPlus'
        geometrieJSON-FG:
          type: string
        statusGeldigheid:
          $ref: '#/components/schemas/StatusGeldigheid'
        aanleveringIdentificatie:
          $ref: '#/components/schemas/AanleveringIdentificatie'
        geometrieXML:
          type: string
          description: De geometrie (in XML formaat) uit de aanlevering aan de LV
            BGT.
        geregistreerdMet:
          $ref: '#/components/schemas/Registratie_1'
      description: "De gemeenschappelijke eigenschappen van een grootschalig\ntopografisch\
        \ object, al dan niet uit de basisregistratie .\n"
    If-Range:
      oneOf:
      - $ref: '#/components/schemas/HTTP-date'
      - $ref: '#/components/schemas/ETag'
    Inrichtingselement:
      title: Inrichtingselement
      type: object
      description: "De gemeenschappelijke eigenschappen van een grootschalig\ntopografisch\
        \ object, al dan niet uit de basisregistratie.\n"
      allOf:
      - $ref: '#/components/schemas/IMGeo-object'
    Installatie:
      title: Installatie
      type: object
      description: Samenhangend systeem dat een bepaald doel dient.
      allOf:
      - $ref: '#/components/schemas/Inrichtingselement'
      - required:
        - bgt-type
        - geometrie
        type: object
        properties:
          bgt-type:
            $ref: '#/components/schemas/TypeInstallatie'
          geometrie:
            $ref: '#/components/schemas/Point'
          plus-type:
            $ref: '#/components/schemas/TypeInstallatiePlus'
    InvalidParams:
      title: InvalidParams
      required:
      - code
      - name
      - reason
      type: object
      properties:
        type:
          type: string
          description: "Een url naar een beschrijving van de fout in de parameter.\
            \ \nDe hier gerefereerde foutbeschrijving is specifieker dan type op het\
            \ \nhoofdniveau van het bericht.\n"
          format: uri
        name:
          type: string
          description: De naam van de parameter waar de fout in zit.
          example: geldigOp
        code:
          type: string
          description: Een vaste waarde afhankelijk van het soort fout.
          example: date
        reason:
          type: string
          description: Een vaste omschrijving afhankelijk van het soort fout.
          example: Waarde is geen geldige datum.
      description: "Wanneer de fout is veroorzaakt door fouten in request parameters\
        \ (of request body), \nwordt invalid-params gevuld met details over elke foute\
        \ parameter.\nWanneer er fouten zitten op meerdere parameters, wordt er per\
        \ validatiefout een \ninvalid-params instantie opgenomen in het antwoord.\
        \ \nAlle fouten worden dus teruggegeven.\nEen gedetailleerde beschrijving\
        \ hoe de onderstaande attributen ingevuld moeten \nworden staat op:\nhttps://github.com/VNG-Realisatie/Haal-Centraal-BRP-bevragen/blob/master/features/foutafhandeling.feature\"\
        \n"
    Inwinningsmethode:
      title: Inwinningsmethode
      type: string
      description: Waardenverzameling voor de wijze waarop het punt is ingewonnen.
      enum:
      - fotogrammetisch
      - laser
      - panoramabeelden
      - terrestrisch
    Kast:
      title: Kast
      type: object
      description: Object met een permanent karakter dat dient om iets in te bergen
        en te beschermen.
      allOf:
      - $ref: '#/components/schemas/Inrichtingselement'
      - required:
        - bgt-type
        - geometrie
        type: object
        properties:
          bgt-type:
            $ref: '#/components/schemas/TypeKast'
          geometrie:
            $ref: '#/components/schemas/Point'
          plus-type:
            $ref: '#/components/schemas/TypeKastPlus'
    Kunstwerkdeel:
      title: Kunstwerkdeel
      type: object
      description: "Onderdeel van een civiel-technisch werk voor de infrastructuur\n\
        van wegen, water, spoorbanen, waterkeringen en/of leidingen.\n"
      allOf:
      - $ref: '#/components/schemas/OverigeConstructie'
      - required:
        - bgt-type
        - geometrie
        type: object
        properties:
          bgt-type:
            $ref: '#/components/schemas/TypeKunstwerk'
          geometrie:
            $ref: '#/components/schemas/MultipuntOfMultivlakOfLijnOfVlak'
          plus-type:
            $ref: '#/components/schemas/TypeKunstwerkPlus'
          stufGeometrieType:
            type: string
    KvKNummer:
      title: KvKNummer
      pattern: "^\\d{8}$"
      type: string
      description: Kamer van Koophandel (KvK) nummer.
      example: "08215619"
    Label:
      title: Label
      required:
      - positie
      - tekst
      type: object
      properties:
        positie:
          minItems: 1
          uniqueItems: true
          type: array
          description: "Labelpositie, samengesteld uit plaatsingspunt en rotatiehoek."
          items:
            $ref: '#/components/schemas/Labelpositie'
        tekst:
          type: string
          description: Tekst voor het label.
      description: |
        Een samengesteld attribuut voor verwijzing naar een te
        plaatsen labeltekst en positie daarvan.
    Labelpositie:
      title: Labelpositie
      required:
      - hoek
      - plaatsingspunt
      type: object
      properties:
        hoek:
          type: number
          description: "De rotatie van het label bij visualisatie, met de\nklok mee\
            \ ten opzichte van de normale tekstrichting.\n"
        plaatsingspunt:
          $ref: '#/components/schemas/Point'
        positieXML:
          type: string
          description: De positie van een label (in XML formaat) uit de aanlevering
            aan LV BGT.
          nullable: true
      description: Locatie waar een label ten behoeve van visualisatie moet worden
        afgebeeld.
    LijnOfPunt:
      title: LijnOfPunt
      description: Lijn- of puntgeometrie.
      oneOf:
      - $ref: '#/components/schemas/CompoundCurve'
      - $ref: '#/components/schemas/Point'
    LijnOfPuntOfVlak:
      title: LijnOfPuntOfVlak
      description: "Lijn-, punt- of vlakgeometrie."
      oneOf:
      - $ref: '#/components/schemas/CompoundCurve'
      - $ref: '#/components/schemas/Point'
      - $ref: '#/components/schemas/CurvePolygon'
    LijnOfVlak:
      title: LijnOfVlak
      description: Lijn- of vlakgeometrie.
      oneOf:
      - $ref: '#/components/schemas/CompoundCurve'
      - $ref: '#/components/schemas/CurvePolygon'
    LineString:
      title: GeoJSON LineString with additional 'coordRefSys' and 'measures' members
      required:
      - coordinates
      - type
      type: object
      properties:
        type: {}
        coordRefSys:
          $ref: '#/components/schemas/coordrefsys'
        measures:
          $ref: '#/components/schemas/measures'
        coordinates:
          minItems: 2
          type: array
          items:
            $ref: '#/components/schemas/position'
        bbox:
          $ref: '#/components/schemas/bbox'
    Mast:
      title: Mast
      type: object
      description: Hoge draagconstructie.
      allOf:
      - $ref: '#/components/schemas/Inrichtingselement'
      - required:
        - bgt-type
        - geometrie
        type: object
        properties:
          bgt-type:
            $ref: '#/components/schemas/TypeMast'
          geometrie:
            $ref: '#/components/schemas/Point'
          plus-type:
            $ref: '#/components/schemas/TypeMastPlus'
    MultiPoint:
      title: GeoJSON MultiPoint with additional 'coordRefSys' and 'measures' members
      required:
      - coordinates
      - type
      type: object
      properties:
        type: {}
        coordRefSys:
          $ref: '#/components/schemas/coordrefsys'
        measures:
          $ref: '#/components/schemas/measures'
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/position'
        bbox:
          $ref: '#/components/schemas/bbox'
    MultiPolygon:
      title: GeoJSON MultiPolygon with additional 'coordRefSys' and 'measures' members
      required:
      - coordinates
      - type
      type: object
      properties:
        type: {}
        coordRefSys:
          $ref: '#/components/schemas/coordrefsys'
        measures:
          $ref: '#/components/schemas/measures'
        coordinates:
          type: array
          items:
            type: array
            items:
              minItems: 4
              type: array
              items:
                $ref: '#/components/schemas/position'
        bbox:
          $ref: '#/components/schemas/Bbox'
    MultiPolygonOfPolygon:
      title: MultipolygonOfPolygon
      description: Multipolygon of Polygon
      oneOf:
      - $ref: '#/components/schemas/MultiPolygon'
      - $ref: '#/components/schemas/Polygon'
    MultiSurface:
      title: JSON-FG MultiSurface
      required:
      - geometries
      - type
      type: object
      properties:
        type: {}
        coordRefSys:
          $ref: '#/components/schemas/coordrefsys'
        measures:
          $ref: '#/components/schemas/measures'
        geometries:
          minItems: 1
          type: array
          items:
            allOf:
            - oneOf:
              - $ref: '#/components/schemas/CurvePolygon'
              - $ref: '#/components/schemas/Polygon'
              - $ref: '#/components/schemas/CustomSurface'
            - not:
                required:
                - coordRefSys
                type: object
                properties:
                  coordRefSys: {}
            - not:
                required:
                - measures
                type: object
                properties:
                  measures: {}
            - not:
                required:
                - conformsTo
                type: object
                properties:
                  conformsTo: {}
        bbox:
          $ref: '#/components/schemas/bbox'
    MultipuntOfMultivlakOfLijnOfVlak:
      title: MultipuntOfMultivlakOfLijnOfVlak
      description: "Multipunt-, multivlak-, lijn-, of vlakgeometrie."
      oneOf:
      - $ref: '#/components/schemas/MultiPoint'
      - $ref: '#/components/schemas/MultiSurface'
      - $ref: '#/components/schemas/CompoundCurve'
      - $ref: '#/components/schemas/CurvePolygon'
    Nummeraanduidingreeks:
      title: Nummeraanduidingreeks
      required:
      - identificatieBAGVBOLaagsteHuisnummer
      - nummeraanduidingreeks
      type: object
      properties:
        nummeraanduidingreeks:
          $ref: '#/components/schemas/Label'
        identificatieBAGVBOLaagsteHuisnummer:
          type: string
          description: |
            Identificatie in de BAG registratie van het verblijfsobject
            met het laagste huisnummer behorende tot de reeks.
        identificatieBAGVBOHoogsteHuisnummer:
          type: string
          description: |
            Identificatie in de BAG registratie van het verblijfsobject
            met het hoogste huisnummer behorende tot de reeks.
      description: |
        Samengesteld attribuut ten behoeve van opname van een
        reeks nummeraanduidingen van verblijfsobjecten in een pand.
    Object:
      title: Object
      description: Een BGT object.
      oneOf:
      - $ref: '#/components/schemas/Bak'
      - $ref: '#/components/schemas/BegroeidTerreindeel'
      - $ref: '#/components/schemas/Bord'
      - $ref: '#/components/schemas/Buurt'
      - $ref: '#/components/schemas/FunctioneelGebied'
      - $ref: '#/components/schemas/Gebouwinstallatie'
      - $ref: '#/components/schemas/Installatie'
      - $ref: '#/components/schemas/Kast'
      - $ref: '#/components/schemas/Kunstwerkdeel'
      - $ref: '#/components/schemas/Mast'
      - $ref: '#/components/schemas/OnbegroeidTerreindeel'
      - $ref: '#/components/schemas/OndersteunendWaterdeel'
      - $ref: '#/components/schemas/OndersteunendWegdeel'
      - $ref: '#/components/schemas/OngeclassificeerdObject'
      - $ref: '#/components/schemas/OpenbareRuimte'
      - $ref: '#/components/schemas/OpenbareRuimteLabel'
      - $ref: '#/components/schemas/Overbruggingsdeel'
      - $ref: '#/components/schemas/OverigBouwwerk'
      - $ref: '#/components/schemas/OverigeScheiding'
      - $ref: '#/components/schemas/Paal'
      - $ref: '#/components/schemas/Pand'
      - $ref: '#/components/schemas/Plaatsbepalingspunt'
      - $ref: '#/components/schemas/Put'
      - $ref: '#/components/schemas/Scheiding'
      - $ref: '#/components/schemas/Sensor'
      - $ref: '#/components/schemas/Spoor'
      - $ref: '#/components/schemas/Stadsdeel'
      - $ref: '#/components/schemas/Straatmeubilair'
      - $ref: '#/components/schemas/Tunneldeel'
      - $ref: '#/components/schemas/VegetatieObject'
      - $ref: '#/components/schemas/Waterdeel'
      - $ref: '#/components/schemas/Waterinrichtingselement'
      - $ref: '#/components/schemas/Waterschap'
      - $ref: '#/components/schemas/Wegdeel'
      - $ref: '#/components/schemas/Weginrichtingselement'
      - $ref: '#/components/schemas/Wijk'
    ObjectEmbedded:
      type: object
      properties:
        aanlevering:
          $ref: '#/components/schemas/AanleveringHalBasis'
        bronhouder:
          $ref: '#/components/schemas/BronhouderHalBasis'
        aanleveraar:
          $ref: '#/components/schemas/AanleveraarHalBasis'
        ligtInWijk:
          $ref: '#/components/schemas/WijkHalBasis'
        ligtInStadsdeel:
          $ref: '#/components/schemas/StadsdeelHalBasis'
        heeftOpenbareRuimteLabel:
          $ref: '#/components/schemas/OpenbareRuimteLabelHalBasis'
    ObjectHal:
      allOf:
      - $ref: '#/components/schemas/ObjectHalBasis'
      - properties:
          _embedded:
            $ref: '#/components/schemas/ObjectEmbedded'
    ObjectHalBasis:
      allOf:
      - $ref: '#/components/schemas/Object'
      - properties:
          _links:
            $ref: '#/components/schemas/ObjectLinks'
    ObjectIdEnType:
      required:
      - identificatie
      - type
