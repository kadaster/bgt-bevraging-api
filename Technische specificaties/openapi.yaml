  /bevragingen/{bevragingIdentificatie}/resultaat:
    get:
      tags:
      - Bevraging
      summary: Opvragen van een bevraging resultaat.
      description: |
        Opvragen van het bestand met het resultaat van een bevraging.
      operationId: opvragenBevragingResultaat
      parameters:
      - name: bevragingIdentificatie
        in: path
        description: De identificatie van een bevraging.
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/BevragingIdentificatie'
      - name: Range
        in: header
        description: "Vraagt een specifiek bytebereik van een representatie op.\n\
          Bijvoorbeeld: bytes=0-1023.\n"
        required: false
        style: simple
        explode: false
        schema:
          pattern: "^bytes=\\d*-\\d*(,\\d*-\\d*)*$"
          type: string
          example: bytes=0-1023
      - name: If-Range
        in: header
        description: "Met de If-Range-header kan een client een gedeeltelijke download\
          \ hervatten. \nAls de gevraagde bron sinds de vorige versie niet is veranderd,\
          \ retourneert \nde server alleen het aangevraagde bereik (Range). Als de\
          \ bron wel is gewijzigd, \nretourneert de server de volledige inhoud van\
          \ de bron.\n"
        required: false
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/If-Range'
      responses:
        "206":
          description: opvragenBevragingResultaat geslaagd
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            Warning:
