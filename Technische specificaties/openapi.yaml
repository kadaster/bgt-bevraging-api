  headers:
    API-Version:
      description: Geeft een specifieke API-versie aan in de context van een specifieke
        aanroep.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: 1.0.1
    Accept-Ranges:
      description: Geeft aan dat bytebereiken worden ondersteund.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: bytes
        enum:
        - bytes
    Content-Digest:
      description: |
        Integriteitscontrole van de HTTP message content conform RFC 9530.
        De waarde bevat ��n of meer digest-algoritmen met hun Base64-gecodeerde hash (SHA-256 of sterker).
      required: false
      style: simple
      explode: false
      schema:
        type: string
        example: sha-256=:X4aBcD123efGHIjklMNoPQRstUVwxyZ456789012345=
    Content-Range:
      description: |
        Geeft aan welk deel van de representatie wordt geretourneerd
        en wat de totale grootte is.
      required: false
      style: simple
      explode: false
      schema:
        pattern: ^bytes \d+-\d+\/(\d+|\*)$
        type: string
        example: bytes 0-1023/4096
    Content-Type:
      description: Media type van het request.
      required: false
      style: simple
      explode: false
      schema:
        type: string
        example: application/json
    ETag:
      description: "Entity Tag van de huidige representatie van de resource.\nKan\
        \ worden gebruikt in voorwaardelijke requests met\nIf-Match, If-None-Match\
        \ en If-Range.\n"
      required: false
      style: simple
      explode: false
      schema:
        $ref: '#/components/schemas/ETag'
    Location:
      description: |
        Zie https://datatracker.ietf.org/doc/html/rfc9110#name-location.
      required: false
      style: simple
      explode: false
      schema:
        type: string
        description: "Bevat een absolute of relatieve URI-reference conform RFC 3986,\
          \ zie https://datatracker.ietf.org/doc/html/rfc3986."
        format: uri
        example: https://api.bgt.kadaster.nl/beheren/v1/bronhouders/gm0226
    Repr-Digest:
      description: |
        Integriteitscontrole van de volledige representatie conform RFC 9530.
        De waarde bevat ��n of meer digest-algoritmen met hun Base64-gecodeerde hash (SHA-256 of sterker).
      required: false
      style: simple
      explode: false
      schema:
        type: string
        example: sha-256=:X4aBcD123efGHIjklMNoPQRstUVwxyZ456789012345=
    Warning:
      description: "Zie RFC 7234, https://datatracker.ietf.org/doc/html/rfc7234. \n\
        In het geval een major versie wordt uitgefaseerd, gebruiken we warn-code 299\
        \ (\"Miscellaneous Persistent Warning\") en het API end-point (inclusief versienummer)\
        \ als de warn-agent van de warning, gevolgd door de warn-text met de human-readable\
        \ waarschuwing.\n"
      required: false
      style: simple
      explode: false
      schema:
        type: string
        example: "299 https://service.../api/.../v1 \"Deze versie van de API is verouderd\
          \ en zal uit dienst worden genomen op 2018-02-01. Raadpleeg voor meer informatie\
          \ hier de documentatie: https://omgevingswet.../api/.../v1\"."
  securitySchemes:
    apiKeyBGT:
      type: apiKey
      description: "De API-key die je hebt gekregen dient bij elke request via de\
        \ `X-Api-Key` \nrequest header meegestuurd te worden. Indien deze niet juist\
        \ wordt \nmeegestuurd, of het een ongeldige key betreft, zul je de foutmelding\
        \ \n`403 Forbidden` terugkrijgen.\n"
      name: X-Api-Key
      in: header
    bearerAuth:
      type: http
      description: |
        Pre-authenticated JWT token.
      scheme: bearer
      bearerFormat: JWT
