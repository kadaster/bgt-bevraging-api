        \ dit kan een bounding box, polygoon of multipolygoon zijn.\n\n2. met een\
        \ lijst van bronhoudercodes.\n\nAanvullend kan er worden gezocht met parameter\
        \ objectTypes. \nAls deze parameter niet wordt opgegeven, dan worden alle\
        \ object types geleverd. \n\nMet de parameter inclusiefBeeindigde kan worden\
        \ aangegeven of van recente object registraties \nalleen registraties met\
