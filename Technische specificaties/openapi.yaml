          $ref: '#/components/schemas/Verwerkingsstatus'
    ObjectenHalCollection_embedded:
      type: object
      properties:
        objecten:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ObjectHal'
    Oin:
      title: Oin
      pattern: "^\\d{20}$"
      type: string
      description: Organisatie Identificatie Nummer (OIN).
      example: "00000001082156190000"
    OnbegroeidTerreindeel:
      title: OnbegroeidTerreindeel
      type: object
      description: "Kleinste functioneel onafhankelijk stukje van een terrein,\ndat\
        \ er binnen het objecttype Terrein van NEN 3610 wordt onderscheiden, zonder\n\
        aaneengesloten vegetatie.\n"
      allOf:
      - $ref: '#/components/schemas/IMGeo-object'
      - required:
        - bgt-fysiekvoorkomen
        - geometrie
        - opTalud
        type: object
