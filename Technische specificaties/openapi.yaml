    Bronhouder:
      title: Bronhouder
      type: object
      description: "Bronhouder zijn: \n  \na. het dagelijks bestuur van een waterschap,\n\
        voor zover het betreft geografische objecten die onderdeel zijn van oppervlaktewateren,\n\
        waterkeringen en kunstwerken, waarvoor een legger als bedoeld in artikel 5.1\n\
        van de Waterwet is vastgesteld, alsmede de daartoe behorende terreinen en\n\
        de wegen die in beheer zijn bij een waterschap; \n\nb. gedeputeerde staten\
        \ van\nde provincie, voor zover het betreft geografische objecten die onderdeel\
        \ zijn\nvan wegen, spoorwegen, oppervlaktewaterlichamen, waterkeringen, kunstwerken\n\
        en de daartoe behorende terreinen die in beheer zijn bij de provincie; \n\n\
        c.\nOnze Minister, voor zover het betreft geografische objecten die onderdeel\n\
        zijn van wegen, oppervlaktewaterlichamen, waterkeringen, kunstwerken en de\n\
        daartoe behorende terreinen die in beheer zijn bij het Rijk; \n\nd. de beheerder\
        \ van de hoofdspoorweginfrastructuur als bedoeld in artikel 1, onder h, van\n\
        de Spoorwegwet, voor zover het betreft geografische objecten die onderdeel\n\
        zijn van spoorwegen, kunstwerken en de daartoe behorende terreinen waarover\n\
        deze het beheer voert; \n\ne. Onze Minister van Economische Zaken, voor zover\n\
        het betreft begroeide terreindelen die in het kader van de uitvoering van\n\
        artikel 24, eerste lid, van de Landbouwwet, en artikel 34, eerste lid, van\n\
        de Meststoffenwet worden ge�dentificeerd; \n\nf. Onze Minister van Defensie,\
        \ voor\nzover het betreft geografische objecten die onderdeel zijn van defensieterrein,\n\
        alsmede de basislijn; \n\ng. burgemeester en wethouders van de gemeente, voor\n\
        zover het betreft geografische objecten: 1�. gesitueerd in het gebied binnen\n\
        de bebouwde kom, bedoeld in artikel 20a, eerste lid, van de Wegenverkeerswet\n\
        1994, met uitzondering van de geografische objecten waarvoor op grond van\n\
        de onderdelen a tot en met f een andere bronhouder verantwoordelijk is; 2�\
        \ngesitueerd in het gebied buiten de bebouwde kom en die onderdeel zijn van\n\
        gebouwen met de bijbehorende erven, alsmede van wegen en kunstwerken en de\n\
        daartoe behorende terreinen die in beheer zijn bij de gemeente, alsmede van\n\
        spoorwegen waarvoor op grond van de onderdelen a tot en met f niet een andere\n\
        bronhouder verantwoordelijk is.\n"
      allOf:
      - $ref: '#/components/schemas/OverheidsOrganisatie'
      - required:
        - code
        - geregistreerdMet
        type: object
        properties:
          code:
            $ref: '#/components/schemas/BronhouderCode'
          aanleveraarIdentificatie:
            $ref: '#/components/schemas/OrganisatieIdentificatie'
          geregistreerdMet:
            $ref: '#/components/schemas/RegistratieLV'
