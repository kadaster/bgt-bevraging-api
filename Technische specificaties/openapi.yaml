          bgt-fysiekvoorkomen:
            $ref: '#/components/schemas/FysiekVoorkomenOnbegroeidTerrein'
          geometrie:
            $ref: '#/components/schemas/CurvePolygon'
          kruinlijn:
            $ref: '#/components/schemas/CompoundCurve'
          kruinlijnGeometrieXML:
            type: string
            description: |
              De geometrie (in XML formaat) van de kruinlijn
              uit de aanlevering aan de LV BGT.
          opTalud:
            type: boolean
            description: Indicatie of het object wel of niet op een hellend vlak ligt.
            nullable: true
          plus-fysiekvoorkomen:
            $ref: '#/components/schemas/FysiekVoorkomenOnbegroeidTerreinPlus'
    OndersteunendWaterdeel:
