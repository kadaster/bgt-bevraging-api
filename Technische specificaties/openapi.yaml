        - bgt-functie
        - bgt-fysiekvoorkomen
        - geometrie
        - opTalud
        type: object
        properties:
          bgt-functie:
            $ref: '#/components/schemas/FunctieOndersteunendWegdeel'
          bgt-fysiekvoorkomen:
            $ref: '#/components/schemas/FysiekVoorkomenOndersteunendWegdeel'
          geometrie:
            $ref: '#/components/schemas/CurvePolygon'
          kruinlijn:
            $ref: '#/components/schemas/CompoundCurve'
          kruinlijnGeometrieXML:
            type: string
            description: |
              De geometrie (in XML formaat) van de kruinlijn uit de aanlevering aan de LV BGT.
          opTalud:
            type: boolean
            description: Indicatie of het object wel of niet op een hellend vlak ligt.
            nullable: true
          plus-functie:
            $ref: '#/components/schemas/FunctieOndersteunendWegdeelPlus'
          plus-fysiekvoorkomen:
            $ref: '#/components/schemas/FysiekVoorkomenOndersteunendWegdeelPlus'
    OngeclassificeerdObject:
      title: OngeclassificeerdObject
      type: object
      description: Object waarvoor geen bronhouder aangewezen is en/of dat niet nader
        is geclassificeerd.
      allOf:
      - $ref: '#/components/schemas/OverigeConstructie'
      - required:
        - geometrie
        type: object
        properties:
          geometrie:
            $ref: '#/components/schemas/MultipuntOfMultivlakOfLijnOfVlak'
    OpenbareRuimte:
      title: OpenbareRuimte
      type: object
      description: |
        Een OPENBARE RUIMTE is een door het bevoegde gemeentelijke
        orgaan als zodanig aangewezen en van een naam voorziene buitenruimte die binnen
